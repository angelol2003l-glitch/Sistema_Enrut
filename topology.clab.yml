name: enrut-ha
prefix: ""

topology:
  kinds:
    linux:
      image: frr-snmp:latest
  nodes:
    # --- PLANO DE GESTION (OOB) ---
    nms:
      kind: linux
      image: nms-telemetry:latest
      labels:
        graph-icon: server
        role: server
      binds:
        - nms:/app
        - tmp/runtime-config/snmp_community:/run/secrets/snmp_community:ro
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.10.1 dev eth1
        - ip route add 10.0.0.0/8 via 192.168.10.1 dev eth1
        - ln -sf /usr/share/zoneinfo/America/Lima /etc/localtime
        - bash -c "nohup python3 /app/monitor_definitivo.py >/dev/null 2>&1 &"

    r-gestion:
      kind: linux
      image: frr-snmp:latest
      labels:
        graph-icon: router
        role: router
      binds:
        - configs/r-gestion/daemons:/etc/frr/daemons
        - configs/r-gestion/frr.conf:/etc/frr/frr.conf
        - tmp/runtime-config/r-gestion/snmpd.conf:/etc/snmp/snmpd.conf:ro
      exec:
        - vtysh -f /etc/frr/frr.conf
        - sysctl -w net.ipv4.ip_forward=1
        - ip route add 192.168.21.0/30 via 192.168.11.2 dev eth2
        - ip route add 192.168.22.0/30 via 192.168.12.2 dev eth3
        - ip route add 192.168.20.0/24 via 192.168.11.2 dev eth2
        - snmpd -u root -C -c /etc/snmp/snmpd.conf

    # --- PLANO CORE Y SERVICIOS P2P ---
    r1:
      kind: linux
      image: frr-snmp:latest
      labels:
        graph-icon: router
        role: router
      binds:
        - configs/r1/daemons:/etc/frr/daemons
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - tmp/runtime-config/r1/snmpd.conf:/etc/snmp/snmpd.conf:ro
        - automation/remediation_server.py:/usr/local/bin/remediation_server.py
      exec:
        - vtysh -f /etc/frr/frr.conf
        - sysctl -w net.ipv4.ip_forward=1
        - ip route add 192.168.10.0/24 via 192.168.11.1 dev eth1
        - snmpd -u root -C -c /etc/snmp/snmpd.conf
        - bash -c "nohup python3 /usr/local/bin/remediation_server.py >/dev/null 2>&1 &"

    r2:
      kind: linux
      image: frr-snmp:latest
      labels:
        graph-icon: router
        role: router
      binds:
        - configs/r2/daemons:/etc/frr/daemons
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - tmp/runtime-config/r2/snmpd.conf:/etc/snmp/snmpd.conf:ro
        - automation/remediation_server.py:/usr/local/bin/remediation_server.py
      exec:
        - vtysh -f /etc/frr/frr.conf
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr replace 192.168.12.2/30 dev eth1
        - ip route add 192.168.10.0/24 via 192.168.12.1 dev eth1
        - snmpd -u root -C -c /etc/snmp/snmpd.conf
        - bash -c "nohup python3 /usr/local/bin/remediation_server.py >/dev/null 2>&1 &"

    # --- PLANO DE DATOS Y ACCESO ---
    r-acceso:
      kind: linux
      image: frr-snmp:latest
      labels:
        graph-icon: router
        role: router
      binds:
        - configs/r-acceso/daemons:/etc/frr/daemons
        - configs/r-acceso/frr.conf:/etc/frr/frr.conf
        - tmp/runtime-config/r-acceso/snmpd.conf:/etc/snmp/snmpd.conf:ro
        - automation/sla_tracker.sh:/usr/local/bin/sla_tracker.sh
        - automation/remediation_server.py:/usr/local/bin/remediation_server.py
      exec:
        - vtysh -f /etc/frr/frr.conf
        - sysctl -w net.ipv4.ip_forward=1
        - ip route add 192.168.10.0/24 via 192.168.21.1 dev eth1
        - ip route add 192.168.10.0/24 via 192.168.22.1 dev eth2 metric 10
        - ip route del default dev eth0
        - snmpd -u root -C -c /etc/snmp/snmpd.conf
        - bash -c "nohup bash /usr/local/bin/sla_tracker.sh >/dev/null 2>&1 &"
        - bash -c "nohup python3 /usr/local/bin/remediation_server.py >/dev/null 2>&1 &"

    pc1:
      kind: linux
      image: alpine:3.19
      labels:
        graph-icon: client
        role: client
      cmd: "sleep infinity"
      exec:
        - ip addr add 192.168.20.50/24 dev eth1
        - ip route replace default via 192.168.20.1

  links:
    # Plano de Gestion OOB
    - endpoints: [ "nms:eth1", "r-gestion:eth1" ]
    - endpoints: [ "r-gestion:eth2", "r1:eth1" ]
    - endpoints: [ "r-gestion:eth3", "r2:eth1" ]

    # Plano Core P2P (Troncal)
    - endpoints: [ "r1:eth2", "r2:eth2" ]

    # Plano de Acceso y Servicios
    - endpoints: [ "r1:eth3", "r-acceso:eth1" ]
    - endpoints: [ "r2:eth3", "r-acceso:eth2" ]
    - endpoints: [ "r-acceso:eth3", "pc1:eth1" ]
